spring.application.name=chat-app-backend

server.port=${PORT:8080}

# No localhost fallback here on purpose: if MONGODB_URI is missing/misnamed,
# the app should FAIL TO START loudly, not silently connect to a local Mongo
# that doesn't exist on Render (this was the earlier "silent localhost fallback" bug).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=chatapp
spring.mongodb.uri=${MONGODB_URI}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

groq.api.key=${GROQ_API_KEY}